<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline-First OS Agent — Private Alpha</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: var(--card);
      padding: 40px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; font-size: 1.8rem; color: var(--text); }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--muted); }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .badge {
      display: inline-block;
      background-color: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge">Open Core / Private Alpha</span>
  <h1>Control your OS & Apps. Anywhere, Offline.</h1>
  <p>Join the waitlist for early access to the cross-device sync engine, mobile controls, and automated desktop agent workflows.</p>

  <form action="YOUR_FORMSPREE_OR_GETFORM_URL" method="POST">
    <div class="form-group">
      <label for="email">Work or Personal Email *</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="apps">Which apps do you want to automate? (e.g. Cursor, Claude, Gmail, OS)</label>
      <textarea id="apps" name="apps_to_automate" rows="3" placeholder="Cursor, Claude Desktop, local terminal..."></textarea>
    </div>

    <button type="submit">Request Early Access</button>
  </form>
</div>

</body>
</html>
